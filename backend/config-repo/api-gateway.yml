server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      default-filters:
        - JwtAuthenticationFilter
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: movie-service
          uri: ${MOVIE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/movies/**
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/users/**

app:
  jwt:
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
